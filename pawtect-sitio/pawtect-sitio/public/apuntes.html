<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apuntes de estudio</title><style>body{margin:0;background:#f3f5f2;color:#253b34;font:17px/1.6 system-ui,sans-serif}main{max-width:620px;margin:8vh auto;padding:28px}h1{font-size:2.5rem;line-height:1.08}section{padding:22px;margin:20px 0;background:#fff;border:1px solid #d9e1d9;border-radius:16px}label{display:block;font-weight:600}input,textarea{font:inherit;padding:10px;max-width:100%;box-sizing:border-box;border:1px solid #8fa498;border-radius:7px}textarea{width:100%;min-height:110px}input{width:8em}output{display:block;margin-top:14px}h2{margin-top:0;font-size:1.35rem}</style></head><body><main><h1>Apuntes de estudio</h1><section><h2>Calculadora de porcentajes</h2><label for="porcentaje">Porcentaje (%)</label><input id="porcentaje" type="number" value="15" step="any"><label for="cantidad">Cantidad</label><input id="cantidad" type="number" value="80" step="any"><output id="resultado" aria-live="polite">Resultado: 12</output></section><section><h2>Notas de esta sesión</h2><label for="notas">¿Qué tema estás repasando?</label><textarea id="notas" placeholder="Escribe tus apuntes aquí…"></textarea></section></main><script src="/ui/apuntes.js"></script></body></html>
